---
layout: default
---

<section class="home-intro site-shell">
  <p class="eyebrow">Personal journal</p>
  <h1>{{ site.title }}</h1>
  <p class="lede">{{ site.description }}</p>
</section>

<section class="site-shell journal-section" aria-labelledby="recent-notes">
  <div class="section-heading">
    <h2 id="recent-notes">Recent notes</h2>
    <a href="{{ '/journal/' | relative_url }}">View the journal <span aria-hidden="true">&rarr;</span></a>
  </div>

  <div class="journal-list">
    {% for post in site.posts limit: 6 %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>
</section>

{{ content }}
