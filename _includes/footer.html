<footer class="site-footer">
  <div class="site-shell footer-wrap">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}.</p>
    <nav class="social-links" aria-label="Elsewhere">
      {% if site.email %}<a href="mailto:{{ site.email | encode_email }}">Email</a>{% endif %}
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a>{% endif %}
      {% if site.twitter_username %}<a href="https://x.com/{{ site.twitter_username }}" rel="me">X</a>{% endif %}
      {% if site.instagram_username %}<a href="https://www.instagram.com/{{ site.instagram_username }}" rel="me">Instagram</a>{% endif %}
    </nav>
  </div>
</footer>
