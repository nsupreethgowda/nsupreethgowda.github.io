<header class="site-header">
  <div class="site-shell nav-wrap">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/journal/' | relative_url }}"{% if page.url contains '/journal' or page.layout == 'post' %} aria-current="page"{% endif %}>Journal</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
